site_name: Dokumentasi Prototipe SmartLab
site_description: Dokumentasi arsitektur, komponen, operasi, dan evaluasi prototipe asisten suara privat SmartLab.

theme:
  name: material
  language: id
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Gunakan mode gelap
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Gunakan mode terang

nav:
  - Beranda: index.md
  - Gambaran Umum: getting-started/overview.md
  - Cara Kerja:
      - Arsitektur Sistem: system/architecture.md
      - Alur Proses: system/runtime-flow.md
      - Jaringan dan Keamanan: system/network-security.md
  - Komponen Sistem:
      - Perangkat Suara: components/voice-satellite.md
      - Speech-to-Text (STT): components/stt.md
      - Small Language Model (SLM): components/slm.md
      - Orkestrasi n8n: components/n8n.md
      - Home Assistant: components/home-assistant.md
      - Text-to-Speech (TTS): components/tts.md
  - Model dan Evaluasi: models/dataset-evaluation.md
  - Operasional:
      - Pemasangan Model dan Pemulihan: operations/deployment.md
      - Pemantauan dan Penanganan Masalah: operations/monitoring-troubleshooting.md
  - Demonstrasi Video: demo/video-scenarios.md
  - Referensi:
      - Endpoint dan Format Data: reference/api-endpoints.md
      - Glosarium: reference/glossary.md
      - Daftar Gambar: reference/media-checklist.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

copyright: Dokumentasi prototipe SmartLab — material publik tanpa rahasia operasional.
